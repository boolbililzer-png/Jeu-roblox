<title>Bagarre Bizarre · Atelier 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;700;800&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout : atelier d'animation — roster à gauche, scène 3D au centre, fiche du coup à droite ; s'empile sur téléphone. Look unique sombre (scène de studio). */
:root{
  --ink:#14123a; --panel:#1d1b4d; --panel2:#262463; --line:#35337a; --fg:#eef0ff; --muted:#a9acd8;
  --amber:#f59e0b; --p:#ef4444; --s:#3b82f6; --up:#10b981; --dn:#8b5cf6;
  --display:"Bowlby One","Arial Black",Impact,sans-serif; --body:"Nunito",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100%;gap:0}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:4px solid var(--amber);background:#0f0d2e}
header h1{font-family:var(--display);font-size:22px;margin:0;letter-spacing:.5px}
header p{margin:0;color:var(--muted);font-size:13px}
.roster{overflow:auto;padding:10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.roster h2,.panel h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 4px 4px;font-weight:800}
.fbtn{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.fbtn:hover{background:var(--panel)}
.fbtn[aria-pressed="true"]{background:var(--panel2);border-color:var(--amber)}
.fbtn:focus-visible,.chip:focus-visible,.mv:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.dot{width:22px;height:22px;border-radius:6px;flex:none;border:2px solid rgba(255,255,255,.25)}
.fbtn small{display:block;color:var(--muted);font-size:11px}
.stage{position:relative;min-width:0;min-height:320px;background:radial-gradient(ellipse at 50% 35%,#2d2a75 0%,#14123a 70%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud > *{pointer-events:auto}
.phases{display:flex;gap:4px;font-family:var(--mono);font-size:11px}
.ph{flex:1;padding:6px 4px;border-radius:6px;background:rgba(15,13,46,.75);color:var(--muted);text-align:center;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em;transition:background .08s}
.ph.on{background:var(--amber);color:#1a1300;border-color:var(--amber);font-weight:800}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:rgba(15,13,46,.75);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ctrl button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font:inherit;font-weight:700;cursor:pointer}
.ctrl button[aria-pressed="true"]{background:var(--amber);color:#1a1300;border-color:var(--amber)}
.ctrl input[type=range]{flex:1;min-width:90px;accent-color:var(--amber)}
.ctrl label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.tag{position:absolute;top:12px;left:12px;font-family:var(--display);font-size:clamp(18px,3vw,28px);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.tag small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);text-shadow:none;font-weight:700}
.hint{position:absolute;top:14px;right:14px;font-size:12px;color:var(--muted)}
.panel{overflow:auto;padding:12px 14px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{margin:0 0 4px;font-family:var(--display);font-size:17px;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:6px 0 0}
.kv dt{color:var(--muted);font-weight:800}.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.mv{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 7px;color:var(--fg);font:inherit;cursor:pointer}
.mv:hover{background:var(--panel)}
.mv[aria-pressed="true"]{background:var(--panel2);border-color:var(--amber)}
.mv .lbl{font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 6px;border-radius:5px;color:#fff;white-space:nowrap}
.mv .nm{font-weight:800;font-size:13px;min-width:0}
.lbl.P{background:var(--p)}.lbl.S{background:var(--s)}.lbl.Sup{background:var(--up)}.lbl.SairD,.lbl.Pair{background:var(--dn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.stat{background:var(--panel2);border-radius:8px;padding:6px 8px}
.stat b{display:block;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.desc{margin:6px 0 0;color:#d6d8ff}
.formula{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:8px}
@media (max-width: 900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 62vh auto;height:auto}
  .roster{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .roster h2{display:none}
  .fbtn small{display:none}
  .fbtn{flex:none}
  .panel{border-left:0}
}
@media (prefers-reduced-motion: reduce){.ph{transition:none}}
</style>

<div class="app">
  <header><h1>BAGARRE BIZARRE</h1><p>Atelier 3D : les 20 combattants et leurs coups, construits et animés avec les mêmes données que le jeu Roblox.</p></header>
  <nav class="roster" id="roster" aria-label="Combattants"></nav>
  <main class="stage" id="stage">
    <div class="tag" id="tag"></div>
    <div class="hint">Glisser pour tourner · molette / pincer pour zoomer</div>
    <div class="hud">
      <div class="phases" id="phases">
        <div class="ph" data-ph="avant">avant le coup</div><div class="ph" data-ph="elan">élan</div>
        <div class="ph" data-ph="frappe">frappe</div><div class="ph" data-ph="retour">retour</div>
      </div>
      <div class="ctrl">
        <button id="play" aria-pressed="true">Pause</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position dans l'animation">
        <button class="spd" data-s="1">×1</button><button class="spd" data-s="0.35" aria-pressed="true">×0,35</button><button class="spd" data-s="0.1">×0,1</button>
        <label><input type="checkbox" id="hb" checked> Hitbox</label>
        <label><input type="checkbox" id="armed" checked> Arme</label>
      </div>
    </div>
  </main>
  <aside class="panel" id="panel"></aside>
</div>

<script>
const DATA = /*__DATA__*/null;
const R = Math.PI/180;
const F = DATA.Fighters;
const G = DATA.States.garde;

/* ---------- Animation (même logique que AnimationPlayer.lua) ---------- */
const easeOut = x => 1-(1-x)*(1-x);
const easeInOut = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
function lerpPose(a,b,t){
  const out={}; const keys=new Set([...Object.keys(a),...Object.keys(b)]);
  for(const k of keys){ const va=a[k]||[0,0,0], vb=b[k]||[0,0,0]; out[k]=[va[0]+(vb[0]-va[0])*t, va[1]+(vb[1]-va[1])*t, va[2]+(vb[2]-va[2])*t]; }
  return out;
}
function movePose(mv,t){
  const tpl=DATA.Templates[mv.anim]; const s=mv.startup, a=mv.active, r=mv.recovery, n=Math.max(1,mv.hits|0);
  if(t<=0) return {pose:G,phase:"avant"};
  if(t<s) return {pose:lerpPose(G,tpl.windup,easeInOut(t/s)),phase:"elan"};
  if(t<s+a){
    const seg=a/n, i=Math.min(n-1,Math.floor((t-s)/seg)), q=((t-s)-i*seg)/seg;
    const alt=tpl.alt; const target=(alt && i%2===1)?alt:tpl.strike;
    let from=tpl.windup; if(i>0) from = alt ? ((i%2===1)?tpl.strike:alt) : lerpPose(tpl.strike,tpl.windup,.5);
    return {pose:lerpPose(from,target,easeOut(Math.min(1,q*3))),phase:"frappe"};
  }
  if(t<s+a+r){ const last=(tpl.alt && (n-1)%2===1)?tpl.alt:tpl.strike; return {pose:lerpPose(last,G,easeInOut((t-s-a)/r)),phase:"retour"}; }
  return {pose:G,phase:"retour"};
}

/* ---------- Construction du modèle (même logique que CharacterBuilder.lua) ---------- */
const MAT = {};
function material(hex,mat,tr){
  const key=hex+mat+tr; if(MAT[key]) return MAT[key];
  const c=new THREE.Color(hex); let m;
  if(mat==="Neon") m=new THREE.MeshBasicMaterial({color:c.clone().multiplyScalar(1.15)});
  else m=new THREE.MeshStandardMaterial({color:c,roughness:mat==="Metal"?0.35:(mat==="Fabric"?0.95:0.6),metalness:mat==="Metal"?0.55:0.02});
  const alpha = mat==="Glass" ? Math.min(1-tr,0.75) : 1-tr;
  if(alpha<1){m.transparent=true;m.opacity=alpha;m.depthWrite=false;}
  return MAT[key]=m;
}
function geo(shape,size){
  let g;
  if(shape==="Ball"){ g=new THREE.SphereGeometry(.5,22,16); g.scale(size[0],size[1],size[2]); }
  else if(shape==="Cyl"){ g=new THREE.CylinderGeometry(.5,.5,1,24); g.rotateZ(-Math.PI/2); g.scale(size[0],size[1],size[2]); }
  else { g=new THREE.BoxGeometry(size[0],size[1],size[2]); }
  return g;
}
function buildFighter(f){
  const [h,w]=f.look.scale; const S=v=>[v[0]*w,v[1]*h,v[2]*w];
  const P=DATA.Rig.Parts, root=new THREE.Group(), frames={}, joints={}, weapons=[];
  const hrpC=S(P.HumanoidRootPart.center);
  frames.HumanoidRootPart=new THREE.Group(); frames.HumanoidRootPart.position.set(...hrpC); root.add(frames.HumanoidRootPart);
  for(const j of DATA.Rig.Joints){
    const c0=S(P[j.part0].center), c1=S(P[j.part1].center), pv=S(j.pivot);
    const jo=new THREE.Group(); jo.userData.c0=[pv[0]-c0[0],pv[1]-c0[1],pv[2]-c0[2]]; jo.position.set(...jo.userData.c0);
    frames[j.part0].add(jo);
    const fr=new THREE.Group(); fr.position.set(-(pv[0]-c1[0]),-(pv[1]-c1[1]),-(pv[2]-c1[2])); jo.add(fr);
    frames[j.part1]=fr; joints[j.name]=jo;
  }
  for(const [name,def] of Object.entries(P)){
    if(name==="HumanoidRootPart") continue;
    const grp=DATA.Rig.ColorGroup[name];
    const m=new THREE.Mesh(geo("Block",S(def.size)), material(f.look.body[grp], f.look.materials[grp]||"SmoothPlastic", f.look.transparency[grp]||0));
    frames[name].add(m);
  }
  for(const a of f.look.acc){
    const mesh=new THREE.Mesh(geo(a.shape,S(a.size)),material(a.color,a.mat,a.tr));
    mesh.position.set(...S(a.pos)); mesh.rotation.set(a.rot[0]*R,a.rot[1]*R,a.rot[2]*R,"XYZ");
    frames[a.attach].add(mesh); if(a.weapon) weapons.push(mesh);
  }
  return {root,joints,weapons,scale:[w,h,w],frames};
}
function applyPose(model,pose){
  const [sx,sy,sz]=model.scale;
  for(const [name,jo] of Object.entries(model.joints)){
    const r=pose[name]||[0,0,0]; const c0=jo.userData.c0;
    let px=c0[0],py=c0[1],pz=c0[2];
    if(name==="Root" && pose.RootPos){ px+=pose.RootPos[0]*sx; py+=pose.RootPos[1]*sy; pz+=pose.RootPos[2]*sz; }
    jo.position.set(px,py,pz); jo.rotation.set(r[0]*R,r[1]*R,r[2]*R,"XYZ");
  }
}

/* ---------- Scène ---------- */
const stage=document.getElementById("stage");
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,1,0.1,500);
scene.add(new THREE.HemisphereLight(0xdfe3ff,0x2a2350,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.85); sun.position.set(-8,14,-10); scene.add(sun);
const rim=new THREE.DirectionalLight(0xffc46b,0.5); rim.position.set(10,6,12); scene.add(rim);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(7,7,0.4,48),new THREE.MeshStandardMaterial({color:0x444466,roughness:.9}));
floor.position.y=-0.2; scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(7,0.12,8,64),new THREE.MeshBasicMaterial({color:0xf59e0b})); ring.rotation.x=Math.PI/2; scene.add(ring);
const hbMat=new THREE.MeshBasicMaterial({color:0xff3b3b,transparent:true,opacity:.2,depthWrite:false});
const hbBox=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),hbMat); scene.add(hbBox);
const hbBall=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),hbMat); scene.add(hbBall);

let yaw=-0.65, pitch=0.16, dist=17.5;
function placeCam(){ const k=cur?Math.max(cur.look.scale[0],cur.look.scale[1]*0.85):1; const t=new THREE.Vector3(0,2.2*k+0.6,0); const d=dist*Math.max(1,k*0.95); cam.position.set(t.x+d*Math.sin(yaw)*Math.cos(pitch),t.y+d*Math.sin(pitch),t.z-d*Math.cos(yaw)*Math.cos(pitch)); cam.lookAt(t); }
function resize(){ const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); renderer.domElement.style.width=r.width+"px"; renderer.domElement.style.height=r.height+"px"; cam.aspect=r.width/Math.max(1,r.height); cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
const ptrs=new Map(); let pinch0=0;
renderer.domElement.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)) return; const [x0,y0]=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch0) dist=Math.max(7,Math.min(40,dist*pinch0/d)); pinch0=d; return; }
  yaw-= (e.clientX-x0)*0.008; pitch=Math.max(-0.3,Math.min(1.2,pitch+(e.clientY-y0)*0.006));
});
const endP=e=>{ptrs.delete(e.pointerId); pinch0=0;};
renderer.domElement.addEventListener("pointerup",endP); renderer.domElement.addEventListener("pointercancel",endP);
renderer.domElement.addEventListener("wheel",e=>{e.preventDefault(); dist=Math.max(7,Math.min(40,dist*(1+Math.sign(e.deltaY)*0.08)));},{passive:false});

/* ---------- État de la page ---------- */
let cur=null, model=null, sel={type:"state",id:"garde"}, t=0, speed=0.35, playing=true, scrubbing=false;
const LEAD=0.3, TAIL=0.35;
function moveOf(slot){ const f=cur; return document.getElementById("armed").checked ? f.moves[slot] : DATA.Unarmed[slot]; }
function totalLen(){ if(sel.type!=="move") return 1.6; const m=moveOf(sel.id); return LEAD+m.startup+m.active+m.recovery+TAIL; }

const roster=document.getElementById("roster");
roster.innerHTML='<h2>Lancement</h2>'+F.filter(f=>f.launch).map(btn).join("")+'<h2>Mises à jour</h2>'+F.filter(f=>!f.launch).map(btn).join("");
function btn(f){ return `<button class="fbtn" data-k="${f.key}" aria-pressed="false"><span class="dot" style="background:${f.look.body.torso}"></span><span>${f.name}<small>#${f.num} · ${f.style}</small></span></button>`; }
roster.addEventListener("click",e=>{const b=e.target.closest(".fbtn"); if(b) pick(b.dataset.k);});

function pick(key){
  cur=F.find(f=>f.key===key);
  for(const b of roster.querySelectorAll(".fbtn")) b.setAttribute("aria-pressed",b.dataset.k===key);
  if(model) scene.remove(model.root);
  model=buildFighter(cur); scene.add(model.root); applyArmed();
  const ar=DATA.Arenas[cur.arena]; floor.material.color.set(ar.floor); ring.material.color.set(ar.trim);
  document.getElementById("tag").innerHTML=`${cur.name}<small>${ar.name}</small>`;
  renderPanel(); placeCam(); t=0;
  try{localStorage.setItem("bb-fighter",key)}catch(_){}
}
function applyArmed(){ const on=document.getElementById("armed").checked; for(const m of model.weapons) m.visible=on; }
document.getElementById("armed").addEventListener("change",()=>{applyArmed(); renderPanel(); t=0;});

const STATE_LBL={garde:"Garde",run:"Course",jump:"Saut",fall:"Chute",hurt:"Touché",dodge:"Esquive",grabbed:"Saisi",victory:"Victoire"};
function lblClass(slot){ return slot==="Sup"?"Sup":slot==="SairD"?"SairD":slot.startsWith("Pair")?"Pair":slot[0]; }
function renderPanel(){
  const f=cur, armed=document.getElementById("armed").checked;
  const set=armed?f.moves:DATA.Unarmed;
  let h=`<div class="card"><h3>${f.name}</h3><dl class="kv"><dt>Style</dt><dd>${f.style} · ${"★".repeat(f.diff)}${"☆".repeat(3-f.diff)}</dd>
    <dt>Arme</dt><dd>${f.weapon}</dd><dt>Passif</dt><dd><b>${f.passiveName}</b> — ${f.passiveDesc}</dd><dt>Poids</dt><dd>${f.weight}</dd></dl></div>`;
  h+=`<h2>États</h2><div class="chips">${Object.keys(STATE_LBL).map(k=>`<button class="chip" data-state="${k}" aria-pressed="${sel.type==="state"&&sel.id===k}">${STATE_LBL[k]}</button>`).join("")}</div>`;
  h+=`<h2>${armed?"Moveset unique (arme équipée)":"Mains nues (moveset commun)"}</h2>`;
  for(const slot of DATA.Slots){ const m=set[slot]; h+=`<button class="mv" data-slot="${slot}" aria-pressed="${sel.type==="move"&&sel.id===slot}"><span class="lbl ${lblClass(slot)}">${DATA.SlotLabel[slot]}</span><span class="nm">${m.name}</span></button>`; }
  if(sel.type==="move"){
    const m=set[sel.id];
    h+=`<div class="card"><h3>${m.name}</h3><p class="desc">${m.desc}</p><div class="stats">
      <div class="stat"><b>${m.dmg}${m.hits>1?" ×"+m.hits:""} %</b><span>Dégâts</span></div>
      <div class="stat"><b>${m.bkb}</b><span>Éjection base</span></div>
      <div class="stat"><b>${m.kbs}</b><span>Multiplicateur</span></div>
      <div class="stat"><b>${m.angle}°</b><span>Angle</span></div>
      <div class="stat"><b>${Math.round(m.startup*60)}f</b><span>Élan</span></div>
      <div class="stat"><b>${Math.round(m.active*60)}+${Math.round(m.recovery*60)}f</b><span>Frappe+retour</span></div></div>
      <p class="formula">Force à 150 % = ${m.bkb} + 150 × ${m.kbs} = ${(m.bkb+150*m.kbs).toFixed(1)}${m.charge?" · chargée ×1,5 = "+((m.bkb+150*m.kbs)*1.5).toFixed(1):""}<br>Type : ${m.kind}${m.status?" · statut "+m.status+" "+m.statusDur+" s":""}</p></div>`;
  }
  document.getElementById("panel").innerHTML=h;
}
document.getElementById("panel").addEventListener("click",e=>{
  const c=e.target.closest("[data-state]"), m=e.target.closest("[data-slot]");
  if(c) sel={type:"state",id:c.dataset.state}; else if(m) sel={type:"move",id:m.dataset.slot}; else return;
  t=0; renderPanel();
});
document.getElementById("play").addEventListener("click",e=>{playing=!playing; e.target.textContent=playing?"Pause":"Lecture"; e.target.setAttribute("aria-pressed",playing);});
for(const b of document.querySelectorAll(".spd")) b.addEventListener("click",()=>{speed=+b.dataset.s; for(const o of document.querySelectorAll(".spd")) o.setAttribute("aria-pressed",o===b);});
const scrub=document.getElementById("scrub");
scrub.addEventListener("input",()=>{scrubbing=true; t=scrub.value/1000*totalLen();});
scrub.addEventListener("change",()=>{scrubbing=false;});

const phEls=[...document.querySelectorAll(".ph")];
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(model){
    const L=totalLen(); if(playing&&!scrubbing) t=(t+dt*speed)%L;
    if(!scrubbing) scrub.value=Math.round(t/L*1000);
    let pose=G, phase=null; let off=[0,0,0];
    hbBox.visible=false; hbBall.visible=false;
    if(sel.type==="state"){
      const k=sel.id;
      if(k==="run"){ const s=(Math.sin(t/L*Math.PI*2*3)+1)/2; pose=lerpPose(DATA.States.runA,DATA.States.runB,s); }
      else if(k==="garde"){ const b=Math.sin(t/L*Math.PI*2)*0.04; pose=Object.assign({},G,{RootPos:[0,G.RootPos[1]+b,0]}); }
      else pose=DATA.States[k];
    } else {
      const m=moveOf(sel.id); const tt=t-LEAD; const r=movePose(m,tt); pose=r.pose; phase=r.phase;
      if(tt>m.startup+m.active+m.recovery) phase="retour";
      const [w,h]=cur.look.scale;
      if(document.getElementById("hb").checked && tt>=m.startup && tt<m.startup+m.active && !m.nohit){
        const cy=DATA.Rig.Parts.HumanoidRootPart.center[1]*h;
        if(["aura","groundpound","vacuum"].includes(m.kind) && m.radius){ hbBall.visible=true; hbBall.scale.setScalar(m.radius); hbBall.position.set(0,cy-1,0); }
        else if(m.kind!=="wall" && m.kind!=="trap"){ hbBox.visible=true; hbBox.scale.set(2.5,m.hb[1]*h,m.hb[0]*w); hbBox.position.set(0,cy+m.off[1]*h,-m.off[0]*w); }
      }
      // petit déplacement visuel pour les coups qui bougent le perso
      const act=Math.max(0,Math.min(1,(tt-m.startup)/Math.max(0.05,m.active+m.recovery*0.5)));
      if(m.kind==="dash") off=[0,0,-5*act];
      if(m.kind==="recovery") off=[0,5*Math.sin(act*Math.PI),0];
      if(m.kind==="groundpound") off=[0,tt<m.startup?3*(tt/m.startup):3*(1-act),0];
    }
    applyPose(model,pose); model.root.position.set(...off);
    phEls.forEach(el=>el.classList.toggle("on",el.dataset.ph===(phase||(sel.type==="move"?"avant":""))));
  }
  placeCam(); renderer.render(scene,cam); requestAnimationFrame(frame);
}
let start="gege"; try{ start=localStorage.getItem("bb-fighter")||"gege"; }catch(_){}
pick(F.some(f=>f.key===start)?start:"gege"); sel={type:"move",id:"Pn"}; renderPanel(); resize(); requestAnimationFrame(frame);
</script>
